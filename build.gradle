plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenCentral()
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
    maven {
        name = "Create Maven"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "Registrate"
        url = "https://maven.ithundxr.dev/snapshots"
    }
    maven {
        name = "Deployer Maven"
        url = "https://maven.liukrast.net"
    }
    maven {
        name = "zznty (Create Factory Abstractions)"
        url = "https://dl.zznty.ru/maven"
    }
    maven {
        name = "BlameJared (JEI)"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "SquidDev (CC: Tweaked)"
        url = "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }
    maven {
        name = "IPN Releases"
        url = "https://maven.ipn-mod.org/releases"
        mavenContent {
            releasesOnly()
        }
        content {
            includeGroup("org.anti_ad.mc")
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Optional "fluids/energy via packages" addon jars (lib/). CreateFluidLogistic ("fluidlogistics"), CreateFluid
// ("fluid") and Create: Repackaged ("repackaged") all hook the same package/logistics system and are mutually
// incompatible at runtime, so exactly ONE is put on the dev runtime, chosen by -PfluidRuntime. We COMPILE against
// the two fluid-FILTER addons (compileOnly) so both FluidFilterProviders build regardless; repackaged has no
// compat code yet, so it's runtime-only (for exploration/testing).
//   -PfluidRuntime=none      (default) → neither (the base runClient stays addon-free)
//   -PfluidRuntime=cfl                 → CreateFluidLogistic (newest fluidlogistics jar in lib/)
//   -PfluidRuntime=cfl-legacy          → CreateFluidLogistic (oldest jar; tests the pre-1.2.5 reflection fallback)
//   -PfluidRuntime=createfluid         → CreateFluid
//   -PfluidRuntime=repackaged          → Create: Repackaged (+ its required compat_manager from maven)
// The IntelliJ ".run/" folder ships ready-made buttons for the CFL, CreateFluid and Repackaged variants.
//
// CreateFluidLogistic ships TWO API generations (1.2.5 refactored fluids into a "PackageResource" system and removed
// setFluidVirtual), and lib/ may hold both jars at once. We COMPILE against the NEWEST one; CflFluidProvider adapts to
// the legacy API by reflection, so a single build runs on either. Pick newest/oldest by a numeric version sort so the
// two-jar case is unambiguous (a bare fluidlogistics-*.jar fileTree would otherwise put both on the classpath).
def modVersionKey = { java.io.File f ->
    def m = (f.name =~ /(\d+(?:\.\d+)+)/)
    (m ? m[0][1] : "0").tokenize('.').collect { String.format('%05d', it as int) }.join('.')
}
def fluidLogisticsJars = fileTree(dir: "lib", include: ["fluidlogistics-*.jar"]).files.sort { modVersionKey(it) }
def fluidLogisticsJar = fluidLogisticsJars.isEmpty() ? files() : files(fluidLogisticsJars.last())        // newest → compile main + `cfl`
def fluidLogisticsLegacyJar = fluidLogisticsJars.size() < 2 ? files() : files(fluidLogisticsJars.first()) // oldest → legacyCompat source set + `cfl-legacy`
def createFluidJar = fileTree(dir: "lib", include: ["fluid-*.jar"])
def repackagedJar = fileTree(dir: "lib", include: ["repackaged-*.jar"])
def fluidRuntime = (project.findProperty('fluidRuntime') ?: 'none').toString().toLowerCase()

// The `run-clean` IntelliJ profile passes -PcleanRuntime. It gets an isolated game directory and only the required
// runtime stack (NeoForge, Minecraft, Create + Create's transitives, and CFC): no Deployer, JEI, FL, fluid addon, or
// jars copied into the normal run/mods directory.
def cleanRuntime = project.hasProperty('cleanRuntime')
if (cleanRuntime && fluidRuntime != 'none')
    throw new GradleException("-PcleanRuntime cannot be combined with -PfluidRuntime")

// Deployer is a SOFT dependency. By default it's on the dev runtime; pass -PnoDeployer (see the
// "runClient (No Deployer)" run config) to launch the client without it and exercise the no-Deployer code paths
// (mixin plugin skips the Deployer mixin, keeper tab is replaced by the in-GUI button, etc.).
def withDeployer = !cleanRuntime && !project.hasProperty('noDeployer')

// Create Factory Logistics is a SOFT dependency and an OPT-IN dev runtime: pass -PfactoryLogistics to launch the
// client with FL on the runtime (see the "runClient (Factory Logistics)" IntelliJ run config). FL is mutually
// incompatible with Deployer AND with the fluid-package addons (fluidlogistics/fluid/repackaged), so a conflict-free
// FL runtime needs -PnoDeployer (enforced below) and the default -PfluidRuntime=none (no fluid addon on the runtime).
def withFactoryLogistics = project.hasProperty('factoryLogistics')
if (cleanRuntime && withFactoryLogistics)
    throw new GradleException("-PcleanRuntime cannot be combined with -PfactoryLogistics")
if (withFactoryLogistics && withDeployer)
    throw new GradleException("-PfactoryLogistics requires -PnoDeployer (Create Factory Logistics and Deployer are mutually exclusive)")

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // A conflict-free Factory Logistics runtime (-PfactoryLogistics) excludes Deployer, but the shared
            // run/mods dev folder is a Deployer + Create: Mobile Packages setup: extra_gauges hard-depends on
            // deployer (breaks under -PnoDeployer), and create_mobile_packages bundles create_factory_abstractions
            // (collides with FL's own JiJ'd copy). Give the FL run its own game directory so its mods/ folder is
            // empty — FL, Create and CFC all come from the classpath. Drop FL-compatible test mods into run-fl/mods.
            if (cleanRuntime) gameDirectory = project.file('run-clean')
            else if (withFactoryLogistics) gameDirectory = project.file('run-fl')

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Create mod (compile + dev runtime; Flywheel/Registrate/Ponder come in transitively)
    compileOnly "com.simibubi.create:create-1.21.1:${create_version}"
    localRuntime "com.simibubi.create:create-1.21.1:${create_version}"

    // Bundle the Higher Logistics Patch sub-mod
    jarJar(project(path: ":higherlogisticspatch"))

    localRuntime project(path: ":higherlogisticspatch")

    // Create: Logistics Control
    compileOnly project(path: ":logisticscontrol")
    jarJar(project(path: ":logisticscontrol"))
    localRuntime project(path: ":logisticscontrol")

    // Deployer (soft dependency — adds the Stock Keeper tab system + generic order dispatch the Production Orders
    // feature hooks into; every reference is guarded by DeployerCompat.isLoaded() / the mixin plugin, so the mod
    // loads and runs without it). We always COMPILE against it; it's on the dev runtime unless -PnoDeployer is set.
    // Consume as a plain jar (transitive = false): Deployer's published runtimeElements variant
    // declares a messy dependency graph (create:slim — which has no NeoForge 1.21.1 artifact —
    // plus curse.maven:* and mezz.jei optional compat from unconfigured repos). IntelliJ's
    // variant-aware source-set importer chokes on that graph and silently drops ALL module
    // dependency wiring (every external import goes red). Its real transitives (Create, Registrate,
    // Ponder, Flywheel) already come from the explicit Create dependency above.
    compileOnly("net.liukrast:deployer-1.21.1:${deployer_version}") { transitive = false }
    if (withDeployer) {
        localRuntime("net.liukrast:deployer-1.21.1:${deployer_version}") { transitive = false }
    }

    // Create Factory Abstractions (soft dependency — Create: Mobile Packages' generic order/stock layer). Compile-only
    // so GenericLogisticsManagerMixin builds; runtime-gated by CfcMixinPlugin on mod id "create_factory_abstractions".
    // No localRuntime: it comes JiJ'd inside Create: Mobile Packages when that mod is on the dev runtime.
    // transitive = false for the same reason as Deployer (avoids its create:slim / curse.maven graph).
    compileOnly("ru.zznty:create_factory_abstractions-1.21.1:${create_factory_abstractions_version}") { transitive = false }

    // Create Factory Logistics (soft dependency — the full logistics mod built on CFA). Compile-only so the
    // FactoryLogistics* adapters/mixins build; runtime-gated by CfcMixinPlugin on mod id "create_factory_logistics".
    // Opt-in dev runtime via -PfactoryLogistics (which requires -PnoDeployer, enforced above). transitive = false
    // for the same reason as CFA/Deployer (avoids FL's create:slim / curse.maven published graph); CFA is already a
    // compileOnly above, so both FL and CFA types are on the compile classpath.
    compileOnly("ru.zznty:create_factory_logistics-1.21.1:${create_factory_logistics_version}") { transitive = false }
    if (withFactoryLogistics) {
        // FL's published jar JiJ's create_factory_abstractions, so CFA rides along on the runtime. If a future FL
        // stops bundling CFA, also add a create_factory_abstractions localRuntime here.
        localRuntime("ru.zznty:create_factory_logistics-1.21.1:${create_factory_logistics_version}") { transitive = false }
    }

    // JEI (optional): compile against the API only; run the full mod in dev for testing.
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    if (!cleanRuntime) {
        localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    }

    // CC: Tweaked (optional — a read-only peripheral on the factory controller; every reference to a
    // dan200.computercraft class is guarded by CcTweakedCompat.isLoaded(), so the mod loads and runs without it).
    // Compile against the common + loader API only; run the full mod in dev for testing. Note: for this MC version
    // CC: Tweaked's own published artifacts keep the "forge" classifier even though the jar targets NeoForge.
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-common-api:${cc_tweaked_version}"
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-forge-api:${cc_tweaked_version}"
    if (!cleanRuntime) {
        localRuntime "cc.tweaked:cc-tweaked-1.21.1-forge:${cc_tweaked_version}"
    }

    // Inventory Profiles Next (optional): annotation API only. IPN reads @IPNIgnore reflectively when installed;
    // keeping the dependency compile-only avoids bundling or requiring IPN at runtime.
    compileOnly("org.anti_ad.mc:InventoryProfilesNext-neoforge-1.21.1:${ipn_version}") { transitive = false }

    // Fluid-logistics addons (optional/soft): CreateFluidLogistic (modid "fluidlogistics") and CreateFluid
    // (modid "fluid"), consumed from local jars in lib/ (neither is on a maven). We COMPILE against both so both
    // FluidFilterProviders build; every use of either addon's classes is guarded by ModList.isLoaded(...), so the
    // mod loads and runs fine with either or neither. The two are MUTUALLY INCOMPATIBLE at runtime, so exactly ONE
    // is added to the dev runtime via localRuntime, selected by -PfluidRuntime (see the fluidRuntime def above).
    // localRuntime jars are scanned as mods by NeoForge in dev (unlike a per-run additionalRuntimeClasspath, which
    // is only a library on the module path and never loads as a mod).
    compileOnly fluidLogisticsJar
    compileOnly createFluidJar
    if (fluidRuntime == 'cfl') {
        localRuntime fluidLogisticsJar
    } else if (fluidRuntime == 'cfl-legacy') {
        localRuntime fluidLogisticsLegacyJar
    } else if (fluidRuntime == 'createfluid') {
        localRuntime createFluidJar
    } else if (fluidRuntime == 'repackaged') {
        localRuntime repackagedJar
        // Create: Repackaged hard-depends on Compat Manager (liukrast maven, not bundled).
        localRuntime("net.liukrast:compat_manager-1.21.1:${compat_manager_version}") { transitive = false }
    }
}

// The fluid-FILTER addon jars (lib/) aren't on any maven and aren't in the repo, so on a clean checkout (e.g. CI)
// they're absent and their provider can't compile. When a jar is missing, drop just that one provider source from
// compilation; FluidCompat instantiates the providers reflectively, so it builds (and at runtime skips any provider
// whose class was excluded). With the lib/ jars present (dev) nothing is excluded and both providers compile as usual.
tasks.named('compileJava') {
    if (fluidLogisticsJar.isEmpty()) exclude '**/compat/fluids/CflFluidProvider.java'
    if (createFluidJar.isEmpty()) exclude '**/compat/fluids/CreateFluidProvider.java'
}

// `legacyCompat` source set: providers compiled against an OLDER version of an optional dependency than `main` uses,
// for back-compat with mods that made breaking API changes. main.output supplies the base classes/interfaces they
// extend; each provider's own old jar is added as a `legacyCompatCompileOnly` entry. Deps go through the source set's
// OWN configurations (not an imperative `compileClasspath =`, which IntelliJ's Gradle model ignores → red errors) so
// the IDE resolves them, and the corresponding *modern* jar is never on this classpath so no version-shadowing is
// needed. Compiled classes are bundled into the mod jar + dev runtime; FluidCompat loads each by name only when the
// old version is detected at runtime, so its removed-API references are never linked against a newer jar.
//
// Currently holds only CflLegacyFluidProvider (pre-1.2.5 CreateFluidLogistic, whose setFluidVirtual filter the 1.2.5
// refactor removed). To add another legacy provider: drop it in src/legacyCompat/java, add its old jar as
// `legacyCompatCompileOnly`, and add a matching `exclude` below so a jar-less checkout (e.g. CI) skips just that file.
sourceSets {
    legacyCompat {
        java { srcDir 'src/legacyCompat/java' }
    }
}
// Minecraft + NeoForge on the source set, via MDG's own API (keeps IntelliJ's classpath model correct).
neoForge.addModdingDependenciesTo(sourceSets.legacyCompat)
dependencies {
    legacyCompatCompileOnly "com.simibubi.create:create-1.21.1:${create_version}"  // Create + Registrate (AllItems/ItemEntry)
    legacyCompatCompileOnly sourceSets.main.output                                 // base providers/interfaces (e.g. CflFluidProvider)
    legacyCompatCompileOnly fluidLogisticsLegacyJar                                // pre-1.2.5 CFL (setFluidVirtual); empty ⇒ harmless
    // Legacy classes on the dev runtime (they sit unused unless the old version is detected).
    localRuntime files(sourceSets.legacyCompat.output)
}
tasks.named('compileLegacyCompatJava') {
    // On a jar-less checkout the matching old jar is absent, so its API can't resolve — drop just that provider.
    if (fluidLogisticsLegacyJar.isEmpty()) exclude '**/compat/fluids/CflLegacyFluidProvider.java'
}
tasks.named('jar') { from sourceSets.legacyCompat.output }

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            deployer_version       : deployer_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
