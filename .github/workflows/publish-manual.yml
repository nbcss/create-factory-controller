name: Build manual
# Publish manual on GitHub Pages
#
# 1. On main branch, create a container image containing the dependencies for building the manual.
# 2. Then for any of the below branches, use the container to build the manual.
# 3. Upload the manual as artifacts to the container registry,
#    which are consumed by `github-pages.yml` to be published under `manual` and `manual-$branch`.

on:
  push:
    branches:
      - main
      - l10n_weblate
    paths:
      - manual/**
      - .github/workflows/publish-manual.yml

jobs:

  build-container:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    concurrency: ${{ github.workflow }} build-container
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            manual

      - &podman_login_step
        name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check for container changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            container:
              - .github/workflows/publish-manual.yml
              - manual/Containerfile
              - manual/Gemfile
              - manual/Gemfile.lock

      - name: Build manual-builder image
        if: steps.filter.outputs.container == 'true'
        uses: redhat-actions/buildah-build@v3
        with:
          context: ./manual
          containerfiles: ./manual/Containerfile
          tags: ghcr.io/${{ github.repository }}/manual-builder:latest
          oci: 'true'
          extra-args: |
            --inherit-annotations=false
            --created-annotation
          annotations: &builder_annotations |
            org.opencontainers.image.description=The container image to build the manual.
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/blob/main/.github/workflows/publish-manual.yml
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          labels: *builder_annotations

      - name: Push manual-builder image
        if: steps.filter.outputs.container == 'true'
        uses: redhat-actions/push-to-registry@v3
        with:
          tags: ghcr.io/${{ github.repository }}/manual-builder:latest

  build:
    needs: build-container
    if: always() && (needs.build-container.result == 'success' || needs.build-container.result == 'skipped')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    concurrency: ${{ github.workflow }} build ${{ github.ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
          sparse-checkout: manual

      - *podman_login_step

      - name: Build manual
        run: podman run --rm --volume "$GITHUB_WORKSPACE:/work" "ghcr.io/$GITHUB_REPOSITORY/manual-builder:latest" rake build

      - name: Upload OCI artifact
        run: |
          tar -C manual/build -czf build.tar.gz .
          podman artifact add --replace \
            --annotation org.opencontainers.image.description="Manual for $GITHUB_REF_TYPE $GITHUB_REF_NAME." \
            --annotation org.opencontainers.image.url="https://github.com/$GITHUB_REPOSITORY/blob/main/.github/workflows/publish-manual.yml" \
            --annotation org.opencontainers.image.revision="$GITHUB_SHA" \
            --annotation org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --annotation org.opencontainers.image.version="$GITHUB_REF_NAME" \
            "ghcr.io/$GITHUB_REPOSITORY/manual:$GITHUB_REF_NAME" \
            build.tar.gz
          podman artifact push "ghcr.io/$GITHUB_REPOSITORY/manual:$GITHUB_REF_NAME"
