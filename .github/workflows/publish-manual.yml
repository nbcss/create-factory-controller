name: Publish manual

env:
  MANUAL_BRANCHES: main l10n_weblate

on:
  push:
    branches:
      - main
      - l10n_weblate
    paths:
      - manual/**
      - .github/workflows/publish-manual.yml

jobs:

  build-container:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency: ${{ github.workflow }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: manual

      - name: Check for container changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            container:
              - manual/Containerfile
              - manual/Gemfile
              - manual/Gemfile.lock

      - name: Log in to GitHub Container Registry
        if: steps.filter.outputs.container == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push manual-builder
        if: steps.filter.outputs.container == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./manual
          file: ./manual/Containerfile
          tags: ghcr.io/${{ github.repository }}/manual-builder:latest
          push: true
          annotations: &builder_annotations |
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          labels: *builder_annotations

  build:
    needs: build-container
    if: always() || needs.build-container.result == 'success' || needs.build-container.result == 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
          sparse-checkout: manual

      - name: Build manual
        run: docker run --rm --volume "${{ github.workspace }}:/work" ghcr.io/${{ github.repository }}/manual-builder:latest rake build

      - &oras_setup_step
        name: Set up ORAS
        uses: oras-project/setup-oras@v2

      - &oras_login_step
        name: Log in to GitHub Container Registry with ORAS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"

      - name: Push manual artifact
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tar -C manual/build -czf build.tar.gz .
          oras push "ghcr.io/${REPOSITORY}/manual:${{ github.ref_name }}" \
            --annotation org.opencontainers.image.revision=${{ github.sha }} \
            --annotation org.opencontainers.image.source=https://github.com/${REPOSITORY} \
            --annotation org.opencontainers.image.version=${{ github.ref_name }} \
            build.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pages: write
    concurrency: ${{ github.workflow }}
    steps:
      - *oras_setup_step
      - *oras_login_step

      - name: Merge manual artifacts
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in $MANUAL_BRANCHES; do
            if [[ "$branch" == main ]]; then
              path=manual
            else
              path="manual-${branch}"
            fi

            if ! oras pull "ghcr.io/${REPOSITORY}/manual:${branch}" --output "$branch"; then
              echo "::warning title=Missing manual artifact::No manual artifact found for branch ${branch}; skipping"
              continue
            fi

            mkdir -p "_site/${path}"
            tar -C "_site/${path}" -xzf "${branch}/build.tar.gz"
          done

          cp _site/manual/404.html _site/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency: ${{ github.workflow }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
