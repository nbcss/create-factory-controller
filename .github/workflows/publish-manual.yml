name: Publish manual
# Publish manual on GitHub Pages
#
# 1. On main branch, create a container image containing the dependencies for building the manual.
# 2. Then for any of the below branches, use the container to build the manual, upload to container registry as artifacts.
# 3. Download artifacts for each branch, then publish under `manual` and `manual-$branch`.

env:
  MANUAL_BRANCHES: main l10n_weblate

on:
  push:
    branches:
      - main
      - l10n_weblate
    paths:
      - manual/**
      - .github/workflows/publish-manual.yml

jobs:

  build-container:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency: ${{ github.workflow }} build-container
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            manual

      - &podman_login_step
        name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check for container changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            container:
              - .github/workflows/publish-manual.yml
              - manual/Containerfile
              - manual/Gemfile
              - manual/Gemfile.lock

      - name: Build manual-builder image
        if: steps.filter.outputs.container == 'true'
        uses: redhat-actions/buildah-build@v3
        with:
          context: ./manual
          containerfiles: ./manual/Containerfile
          tags: ghcr.io/${{ github.repository }}/manual-builder:latest
          annotations: &builder_annotations |
            org.opencontainers.image.description=The container image to build the manual.
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/blob/main/.github/workflows/publish-manual.yml
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          labels: *builder_annotations

      - name: Push manual-builder image
        if: steps.filter.outputs.container == 'true'
        uses: redhat-actions/push-to-registry@v3
        with:
          tags: ghcr.io/${{ github.repository }}/manual-builder:latest

  build:
    needs: build-container
    if: always() && (needs.build-container.result == 'success' || needs.build-container.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency: ${{ github.workflow }} build ${{ github.ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
          sparse-checkout: manual

      - *podman_login_step

      - name: Build manual
        run: podman run --rm --volume "$GITHUB_WORKSPACE:/work" "ghcr.io/$GITHUB_REPOSITORY/manual-builder:latest" rake build

      - name: Push manual artifact
        run: |
          tar -C manual/build -czf build.tar.gz .
          podman artifact add --replace \
            --annotation org.opencontainers.image.description="Manual for $GITHUB_REF_TYPE $GITHUB_REF_NAME." \
            --annotation org.opencontainers.image.url="https://github.com/$GITHUB_REPOSITORY/blob/main/.github/workflows/publish-manual.yml" \
            --annotation org.opencontainers.image.revision="$GITHUB_SHA" \
            --annotation org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --annotation org.opencontainers.image.version="$GITHUB_REF_NAME" \
            "ghcr.io/$GITHUB_REPOSITORY/manual:$GITHUB_REF_NAME" \
            build.tar.gz
          podman artifact push "ghcr.io/$GITHUB_REPOSITORY/manual:$GITHUB_REF_NAME"

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
      pages: write
    concurrency: ${{ github.workflow }} merge
    steps:
      - *podman_login_step

      - name: Merge manual artifacts
        run: |
          mkdir -p artifacts

          for branch in $MANUAL_BRANCHES; do
            if [[ "$branch" == main ]]; then
              path=manual
            else
              path="manual-${branch}"
            fi

            if ! podman artifact pull "ghcr.io/$GITHUB_REPOSITORY/manual:$branch"; then
              echo "::warning title=Missing manual artifact::No manual artifact found for branch $branch; skipping"
              continue
            fi

            podman artifact extract --title build.tar.gz "ghcr.io/$GITHUB_REPOSITORY/manual:$branch" "artifacts/${branch}.tar.gz"
            mkdir -p "_site/$path"
            tar -C "_site/$path" -xzf "artifacts/${branch}.tar.gz"
          done

          cp _site/manual/404.html _site/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency: ${{ github.workflow }} deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
