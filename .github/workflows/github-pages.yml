name: Publish GitHub Pages

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}

jobs:
  merge:
    runs-on: ubuntu-26.04
    permissions:
      packages: read
      pages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract content from artifacts
        shell: bash -xeuo pipefail {0}
        run: |
          mkdir -p "_site"
          for name in javadoc manual; do
            registry_tags="$(skopeo list-tags "docker://ghcr.io/$GITHUB_REPOSITORY/$name" | jq -r '.Tags[]' || true)"
            [[ -z "$registry_tags" ]] && echo "::warning ::Missing artifact $name, skipping"

            mkdir -p "artifacts/$name"
            for tag in $registry_tags; do
              podman artifact pull "ghcr.io/$GITHUB_REPOSITORY/$name:$tag"
              podman artifact extract --title build.tar.gz "ghcr.io/$GITHUB_REPOSITORY/$name:$tag" "artifacts/$name/$tag.tar.gz"

              [[ "$tag" == main ]] && path="$name" || path="$name:$tag"
              mkdir -p "_site/$path"
              tar -C "_site/$path" -xzf "artifacts/$name/$tag.tar.gz"
            done
          done

      - name: Generate index and 404 page
        shell: ruby {0}
        run: |
          Gem.install 'natural_sort', '~> 1'
          require 'natural_sort'
          require 'cgi'

          template = []
          template[0] = <<END
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta name="robots" content="noindex, nofollow">
              <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
              <style>
              :root {
                color: #1a1a1a;
                background: #ffffff;
                font-family: sans-serif;
              }
              a:link, a:visited {
                color: #0066cc;
                text-decoration: none;
              }
              a:hover {
                text-decoration: underline;
              }
              @media (prefers-color-scheme: dark) {
                :root {
                  color: #f0f0f0;
                  background: #0c0c0c;
                }
                a:link, a:visited {
                  color: #5da7f2;
                }
              }
              </style>
            </head>
            <body>
          END
          template[1] = <<END
            </body>
          </html>
          END

          entries = Dir.entries('_site') - %w(. .. index.html 404.html)
          categories = %w(manual javadoc)

          File.open '_site/index.html', 'w' do |file|
            file.puts template[0]
            file.puts '<h1>Create: Factory Controller</h1>'
            categories.map do |category|
              [category, entries.filter{|e| e.start_with? category }]
            end.prepend(
              [nil, entries.reject{|e| categories.any?{|c| e.start_with? c } }]
            ).each do |(category, entries)|
              file.puts '<section>'
              file.puts "<h2 id=\"#{CGI.h category}\">#{CGI.h category}</h2>" if category
              file.puts '<ul>'
              entries.sort(&NaturalSort).each do |entry|
                file.puts "<li><a href=\"./#{CGI.h entry}\">#{CGI.h entry}</a></li>"
              end
              file.puts '</ul>'
              file.puts '</section>'
            end
            file.puts template[1]
          end

          File.open '_site/404.html', 'w' do |file|
            file.puts template[0]
            file.puts '<h1>Page not found</h1>'
            file.puts "<nav><a href=\"/#{CGI.h ENV['GITHUB_REPOSITORY'].split('/', 2).last}/\">Return to Home</a></nav>"
            file.puts <<~END
            <script>
            (function() {
              let path = location.pathname;
              if (path.endsWith('/')) path += 'index.html';
              if (/\.html$/.test(path)) {
                const redirectUrl = path.replace(/\.html$/, '.translation-missing.html');
                fetch(redirectUrl, { method: 'HEAD' }).then((response) => {
                  if (response.ok) location.replace(redirectUrl + location.hash);
                });
              }
            })();
            </script>
            END
            file.puts template[1]
          end

      - name: Generate job summary
        run: |
          echo "Site root:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls _site | sed 's/$/  /' >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: merge
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
