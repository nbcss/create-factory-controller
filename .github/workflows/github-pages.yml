name: Publish GitHub Pages

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}

jobs:
  merge:
    runs-on: ubuntu-26.04
    permissions:
      packages: read
      pages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract content from artifacts
        shell: bash -xeuo pipefail {0}
        run: |
          mkdir -p "_site"
          for name in javadoc manual; do
            registry_tags="$(skopeo list-tags "docker://ghcr.io/$GITHUB_REPOSITORY/$name" | jq -r '.Tags[]' || true)"
            [[ -z "$registry_tags" ]] && echo "::warning ::Missing artifact $name, skipping"

            mkdir -p "artifacts/$name"
            for tag in $registry_tags; do
              podman artifact pull "ghcr.io/$GITHUB_REPOSITORY/$name:$tag"
              podman artifact extract --title build.tar.gz "ghcr.io/$GITHUB_REPOSITORY/$name:$tag" "artifacts/$name/$tag.tar.gz"

              [[ "$tag" == main ]] && path="$name" || path="$name:$tag"
              mkdir -p "_site/$path"
              tar -C "_site/$path" -xzf "artifacts/$name/$tag.tar.gz"
            done
          done

          cp _site/manual/404.html _site/404.html || true

      - name: Generate index
        shell: ruby {0}
        run: |
          require 'cgi'
          entries = Dir.entries('_site') - %w(. .. index.html 404.html)
          categories = %w(manual javadoc)
          $> = File.open '_site/index.html', 'w'
          puts <<END
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta name="robots" content="noindex, nofollow">
              <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
              <style>
              :root { color: #1a1a1a; background: #ffffff; }
              @media (prefers-color-scheme: dark) {
                :root { color: #f0f0f0; background: #0c0c0c; }
              }
              </style>
            </head>
            <body>
          END
          categories.map do |category|
            [category, entries.filter{|e| e.start_with? category }]
          end.prepend(
            [nil, entries.reject{|e| categories.any?{|c| e.start_with? c } }]
          ).each do |(category, entries)|
            puts "<h2 id=\"#{CGI.h category}\">#{CGI.h category}</h2>" if category
            entries.each do |entry|
              puts "<li><a href=\"./#{CGI.h entry}\">#{CGI.h entry}</a></li>"
            end
          end
          puts <<END
            </body>
          </html>
          END

      - name: Generate job summary
        run: |
          echo "Site root:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls _site | sed 's/$/  /' >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: merge
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
