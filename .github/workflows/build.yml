name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # This mod bundles Create: Logistics Control via Jar-in-Jar and consumes it as a Gradle composite build
      # (settings.gradle: includeBuild '../create_logistics_control'). Check out both repositories as sibling
      # directories under the Actions workspace so that relative path resolves.
      - name: "Checkout Create: Factory Controller"
        uses: actions/checkout@v4
        with:
          path: create_factory_controller
          fetch-depth: 0
          fetch-tags: true

      - name: "Checkout Create: Higher Logistics Patch"
        uses: actions/checkout@v4
        with:
          repository: nbcss/create-higher-logistics-patch
          path: create_higher_logistics_patch

      - name: "Checkout Create: Logistics Control"
        uses: actions/checkout@v4
        with:
          repository: nbcss/create-logistics-control
          path: create_logistics_control
          # If create-logistics-control is a PRIVATE repository, the default GITHUB_TOKEN cannot read it —
          # add `token: ${{ secrets.CLC_CHECKOUT_TOKEN }}` here with a PAT that has read access.

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: create_factory_controller

      - name: Build with Gradle
        run: ./gradlew build
        working-directory: create_factory_controller
